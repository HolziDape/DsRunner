<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>DsRunner Stream Testseite</title>
<style>
  html, body { margin: 0; height: 100%; background: #101820; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Local test page for DsRunner Stream: a small keyboard game (move the square with
// the arrow keys or WASD, Space changes its color, a click/touch drops a marker),
// an animated test pattern and an fps counter.
// URL options: ?motion=low|normal|high (how much of the picture moves), ?static=1
"use strict";
const params = new URLSearchParams(location.search);
const motion = params.get("static") ? "none" : (params.get("motion") || "normal");
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const state = window.testState = {
  x: 0.5, y: 0.6, color: 0, keys: {}, keydowns: 0, lastKey: "-", clicks: 0,
  lastClick: null, mouse: null, frames: 0, fps: 0
};
const colors = ["#ffcc00", "#33dd66", "#ff5577", "#55aaff"];
const held = state.keys;

addEventListener("keydown", e => {
  if (!held[e.code]) state.keydowns++;
  held[e.code] = true;
  state.lastKey = e.code;
  if (e.code === "Space") state.color = (state.color + 1) % colors.length;
  e.preventDefault();
});
addEventListener("keyup", e => { held[e.code] = false; e.preventDefault(); });
addEventListener("mousemove", e => { state.mouse = [e.clientX / innerWidth, e.clientY / innerHeight]; });
addEventListener("mousedown", e => {
  state.clicks++;
  state.lastClick = [e.clientX / innerWidth, e.clientY / innerHeight];
});

function resize() { cv.width = innerWidth; cv.height = innerHeight; }
addEventListener("resize", resize);
resize();

let last = performance.now(), fpsT = last, fpsN = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  fpsN++;
  if (now - fpsT >= 1000) { state.fps = Math.round(fpsN * 1000 / (now - fpsT)); fpsN = 0; fpsT = now; }
  state.frames++;
  const W = cv.width, H = cv.height, t = now / 1000;
  const sp = 0.45 * dt;
  if (held.ArrowLeft || held.KeyA) state.x -= sp;
  if (held.ArrowRight || held.KeyD) state.x += sp;
  if (held.ArrowUp || held.KeyW) state.y -= sp;
  if (held.ArrowDown || held.KeyS) state.y += sp;
  state.x = Math.min(0.95, Math.max(0.05, state.x));
  state.y = Math.min(0.95, Math.max(0.35, state.y));

  ctx.fillStyle = "#101820";
  ctx.fillRect(0, 0, W, H);

  // color bars (static) with a moving gradient strip below
  const bars = ["#ffffff", "#ffff00", "#00ffff", "#00ff00", "#ff00ff", "#ff0000", "#0000ff", "#000000"];
  const bh = H * 0.12;
  bars.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(i * W / 8, 0, W / 8 + 1, bh); });
  const off = motion === "none" ? 0 : (t * 0.25) % 1;
  const g = ctx.createLinearGradient(-W * off, 0, W * (2 - off), 0);
  for (let i = 0; i <= 8; i++) g.addColorStop(i / 8, `hsl(${i * 90}, 80%, 55%)`);
  ctx.fillStyle = g;
  ctx.fillRect(0, bh, W, H * 0.06);

  // scrolling checkerboard (lots of moving edges) and spinner
  if (motion !== "none") {
    const cs = Math.max(8, Math.round(W / 32));
    const area = motion === "high" ? [0, H * 0.18, W, H * 0.82] : [0, H * 0.18, W * 0.3, H * 0.14];
    ctx.save();
    ctx.beginPath(); ctx.rect(...area); ctx.clip();
    const s = (t * cs * 2) % (cs * 2);
    for (let y = area[1] - cs * 2; y < area[1] + area[3]; y += cs)
      for (let x = -cs * 2; x < area[2]; x += cs)
        if (((Math.floor((x + 2 * cs) / cs) + Math.floor((y - area[1] + 2 * cs) / cs)) & 1) === 0) {
          ctx.fillStyle = "#2a3a4a";
          ctx.fillRect(x + s, y + s * 0.5, cs, cs);
        }
    ctx.restore();
    ctx.save();
    ctx.translate(W * 0.85, H * 0.25);
    ctx.rotate(t * 3);
    ctx.fillStyle = "#ff8800";
    ctx.fillRect(-W * 0.04, -H * 0.008, W * 0.08, H * 0.016);
    ctx.restore();
  }

  // the player
  const ps = W * 0.06;
  ctx.fillStyle = colors[state.color];
  ctx.fillRect(state.x * W - ps / 2, state.y * H - ps / 2, ps, ps);
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = Math.max(1, W / 256);
  ctx.strokeRect(state.x * W - ps / 2, state.y * H - ps / 2, ps, ps);

  // last click marker and mouse cursor
  if (state.lastClick) {
    const [cx, cy] = state.lastClick;
    ctx.strokeStyle = "#ff3355"; ctx.lineWidth = Math.max(2, W / 128);
    ctx.beginPath(); ctx.arc(cx * W, cy * H, W * 0.025, 0, Math.PI * 2); ctx.stroke();
  }
  if (state.mouse) {
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(state.mouse[0] * W - 1, state.mouse[1] * H - 1, 3, 3);
  }

  // text: big enough to stay readable at 256x192
  const fs = Math.round(H / 14);
  ctx.font = `bold ${fs}px monospace`;
  ctx.fillStyle = "#ffffff";
  ctx.fillText(`FPS ${state.fps}`, W * 0.02, H * 0.3);
  ctx.fillText(`Taste ${state.lastKey}`, W * 0.02, H * 0.3 + fs * 1.2);
  ctx.fillText(`Klicks ${state.clicks}`, W * 0.02, H * 0.3 + fs * 2.4);
  ctx.fillText(`#${state.frames}`, W * 0.6, H * 0.97);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
