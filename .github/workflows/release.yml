name: Build DsRunner release

# Runs when a release is published on GitHub (tag vX.Y.Z, see docs/RELEASE.md).
# The tag decides the version. When VERSION, DsRunner Art or CHANGELOG.md don't match it yet,
# every job sets them in its checkout (tools/version.sh release) and the run shows a warning.

on:
  release:
    types: [published]

jobs:
  version:
    runs-on: ubuntu-latest
    name: Check version
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Version from the tag
        id: check
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          sh tools/version.sh release "$TAG"
          echo "version=$(sh tools/version.sh)" >> "$GITHUB_OUTPUT"

  release_notes:
    runs-on: ubuntu-latest
    name: Release notes from CHANGELOG.md
    # after the builds: their upload step writes the release description back as it was
    # when it started, so this job comes last (and also runs when a build failed)
    needs: [version, pico_loader, pico_launcher, dsrunner_art]
    if: always() && needs.version.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Version from the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: sh tools/version.sh release "$TAG" > /dev/null
      - name: Put the changelog section on top of the release description
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          marker='<!-- dsrunner-changelog -->'
          existing="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.body // ""')"
          # re-runs replace the part written before
          case "$existing" in
            *"$marker"*) existing="${existing#*"$marker"}" ;;
          esac
          # without leading blank lines
          existing="${existing#"${existing%%[![:space:]]*}"}"
          {
            sh tools/version.sh notes "$VERSION" || true
            echo
            echo '**Installation:** Für die M3 DS Real `DsRunner_M3DSReal.zip` entpacken und den Inhalt ins Hauptverzeichnis der SD-Karte kopieren (Anleitung in `LIESMICH.txt`). Die Emulatoren für GBA, NES, Game Boy und SNES sind dabei (`_dsrunner/emulators`). **Update:** nur `_nds/TWiLightMenu/main.srldr` ersetzen. Mehr im [README](https://github.com/HolziDape/DsRunner#readme).'
            echo
            echo "$marker"
            if [ -n "$existing" ]; then
              echo
              echo "$existing"
            fi
          } > notes.md
          cat notes.md
          gh release edit "$TAG" --repo "$REPO" --notes-file notes.md

  pico_loader:
    runs-on: ubuntu-latest
    needs: version
    # same toolchain as the pico-loader CI; keep in sync with PICO_LOADER_BLOCKSDS_IMAGE in loader/UPSTREAM
    container: skylyrac/blocksds:slim-v1.20.0
    name: Build Pico Loader (loader/)
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Check the toolchain image
        run: |
          grep -qx 'PICO_LOADER_BLOCKSDS_IMAGE=skylyrac/blocksds:slim-v1.20.0' loader/UPSTREAM || {
            echo "::error::container image of this job and loader/UPSTREAM differ"
            exit 1
          }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.x
      - name: Cache the pico-loader clone
        uses: actions/cache@v4
        with:
          path: loader/work/pico-loader
          key: pico-loader-${{ hashFiles('loader/UPSTREAM') }}
          restore-keys: pico-loader-
      - name: Clone, patch and build
        run: sh loader/build.sh loader/out
      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v4
        with:
          path: loader/out/
          name: PicoLoader_M3DS_DsRunner

  pico_launcher:
    runs-on: ubuntu-latest
    # the M3 DS Real package contains the Pico Loader built by the job above
    needs: [version, pico_loader]
    # the job attaches the zips to the release, the default token can only read
    permissions:
      contents: write
    container: skylyrac/blocksds:slim-v1.16.0
    name: Build DsRunner
    env:
      # version from VERSION without "-dev" in the launcher, banner and LIESMICH.txt
      DSRUNNER_RELEASE: "1"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install zip
        run:
          apt-get update && apt-get -y install zip unzip curl p7zip-full
      - name: Version from the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: sh tools/version.sh release "$TAG" > /dev/null
      - name: Run build script
        run: |
          make
      - name: Get the Pico Loader build
        uses: actions/download-artifact@v4
        with:
          name: PicoLoader_M3DS_DsRunner
          path: loader/out
      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v4
        with:
          path: |
            _pico/
            DsRunner.nds
          name: DsRunner
      - name: Package for release
        run: |
          mkdir DsRunner
          cp -r _pico/ DsRunner.nds DsRunner
          # same emulators and licenses as in DsRunner_M3DSReal.zip
          sh tools/fetch-emulators.sh DsRunner
          cd DsRunner && zip -r $PWD.zip *
      - name: Package for M3 DS Real (autoboot)
        env:
          # Pico Loader from loader/out (job pico_loader), not the upstream release
          DSRUNNER_LOADER: custom
        run: |
          sh tools/make-sd-package.sh DsRunner_M3DSReal
          cd DsRunner_M3DSReal && zip -r $PWD.zip *
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DsRunner.zip
            DsRunner_M3DSReal.zip

  dsrunner_art:
    runs-on: windows-latest
    needs: version
    name: Build DsRunner Art (Windows)
    permissions:
      contents: write
    defaults:
      run:
        working-directory: tools/dsrunner-art
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Version from the tag
        working-directory: .
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: sh tools/version.sh release "$TAG" > /dev/null
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests -t .
      - name: Build DsRunnerArt.exe
        run: pyinstaller --onefile --windowed --name DsRunnerArt dsrunner_art.py
      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v4
        with:
          path: tools/dsrunner-art/dist/DsRunnerArt.exe
          name: DsRunnerArt
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: tools/dsrunner-art/dist/DsRunnerArt.exe
