name: Build DsRunner release

on:
  release:
    types: [published]

jobs:
  pico_launcher:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-v1.16.0
    name: Build DsRunner
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install zip
        run:
          apt-get update && apt-get -y install zip unzip curl p7zip-full
      - name: Run build script
        run: |
          make
      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v4
        with:
          path: |
            _pico/
            DsRunner.nds
          name: DsRunner
      - name: Package for release
        run: |
          mkdir DsRunner
          cp -r _pico/ DsRunner.nds DsRunner
          cd DsRunner && zip -r $PWD.zip *
      - name: Package for M3 DS Real (autoboot)
        run: |
          sh tools/make-sd-package.sh DsRunner_M3DSReal
          cd DsRunner_M3DSReal && zip -r $PWD.zip *
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DsRunner.zip
            DsRunner_M3DSReal.zip
