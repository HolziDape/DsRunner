name: Build

on:
  push:
    branches: [ develop, 'feature/**', 'fix/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20200730
    strategy:
      fail-fast: false
      matrix:
        variant: [ arm9dldi_ds, arm7dldi_ds, arm7dldi_ds_rom3M, arm7dldi_dsi, arm7dldi_3ds ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build ${{ matrix.variant }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sh ./build.sh ${{ matrix.variant }}

      - uses: actions/upload-artifact@v4
        with:
          name: GBARunner2_${{ matrix.variant }}
          path: build/GBARunner2_${{ matrix.variant }}.nds

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.nds
          generate_release_notes: true
