name: Build DsRunner

on:
  push:
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: ["develop"]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  pico_launcher:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-v1.16.0
    name: Build DsRunner
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Run build script
        # development build: version from VERSION with "-dev+<commit>" (see Makefile)
        run: |
          make DSRUNNER_COMMIT="$(echo "$GITHUB_SHA" | cut -c1-7)"
      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v4
        with:
          path: |
            _pico/
            DsRunner.nds
          name: DsRunner
