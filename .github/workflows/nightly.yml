name: Build DsRunner

on:
  push:
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: ["develop"]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  pico_loader:
    runs-on: ubuntu-latest
    # same toolchain as the pico-loader CI; keep in sync with PICO_LOADER_BLOCKSDS_IMAGE in loader/UPSTREAM
    container: skylyrac/blocksds:slim-v1.20.0
    # catches patches that no longer apply or build; the artifact is the loader of the SD package
    name: Build Pico Loader (loader/)
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Check the toolchain image
        run: |
          grep -qx 'PICO_LOADER_BLOCKSDS_IMAGE=skylyrac/blocksds:slim-v1.20.0' loader/UPSTREAM || {
            echo "::error::container image of this job and loader/UPSTREAM differ"
            exit 1
          }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.x
      - name: Cache the pico-loader clone
        uses: actions/cache@v4
        with:
          path: loader/work/pico-loader
          key: pico-loader-${{ hashFiles('loader/UPSTREAM') }}
          restore-keys: pico-loader-
      - name: Clone, patch and build
        run: sh loader/build.sh loader/out
      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v4
        with:
          path: loader/out/
          name: PicoLoader_M3DS_DsRunner

  pico_launcher:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-v1.16.0
    name: Build DsRunner
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Run build script
        # development build: version from VERSION with "-dev+<commit>" (see Makefile)
        run: |
          make DSRUNNER_COMMIT="$(echo "$GITHUB_SHA" | cut -c1-7)"
      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v4
        with:
          path: |
            _pico/
            DsRunner.nds
          name: DsRunner

  dsrunner_stream:
    runs-on: ubuntu-latest
    # same toolchain as DsRunner, the image ships DSWiFi
    container: skylyrac/blocksds:slim-v1.16.0
    name: Build DsRunner Stream (stream/ds)
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Build DsRunnerStream.nds
        # inside the container (BLOCKSDS is set) build.sh runs make directly
        run: sh stream/ds/build.sh
      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v4
        with:
          path: stream/ds/DsRunnerStream.nds
          name: DsRunnerStream

  stream_host:
    runs-on: ubuntu-latest
    name: DsRunner Stream host (tests + DsRunnerStream-Host.zip)
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r stream/host/requirements.txt pytest
      - name: Run tests
        # without a browser; also builds the DS decoder for the PC (stream/ds/hosttest)
        working-directory: stream/host
        run: python -m pytest -q tests
      - name: Check the shell scripts
        # shellcheck is preinstalled on the GitHub Ubuntu runners
        run: shellcheck stream/host/start.sh stream/host/tools/*.sh
      - name: Pack DsRunnerStream-Host.zip
        run: sh stream/host/tools/make-host-bundle.sh DsRunnerStream-Host.zip
      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v4
        with:
          # the artifact zip contains DsRunnerStream-Host.zip as it is attached to releases
          path: DsRunnerStream-Host.zip
          name: DsRunnerStream-Host
